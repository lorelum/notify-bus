name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# `verify` needs no write permission; only a push to main gets package write
# access and publishes an image.
permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # Private repositories use the organization build pool automatically.
    # Public repositories and fork PRs always stay GitHub-hosted.
    runs-on: >-
      ${{ fromJSON(
        github.event.repository.private &&
        !(github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository) &&
        '["lorelum-private-ci"]' ||
        '["ubuntu-24.04"]'
      ) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The self-hosted build runner ships Bun; a GitHub-hosted runner does not.
      # `make ci` itself only installs this project's own dependencies.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      # `make ci` must install from the lockfile and run every check from a fresh
      # checkout — see the Makefile.
      - name: Run service checks
        run: make ci

  image:
    name: Build / publish GHCR image
    needs: verify
    runs-on: ${{ fromJSON(github.event.repository.private && '["lorelum-private-ci"]' || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image repository
        id: image
        shell: bash
        run: |
          repository="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REPOSITORY_OWNER")/notify-bus"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release tag
        id: release
        shell: bash
        run: |
          release_date="$(date -u +%Y%m%d)"
          release_tag="${release_date}-${GITHUB_SHA:0:8}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      # The docker-container driver supports GitHub Actions cache on both
      # GitHub-hosted runners and the cluster's ARC Docker-in-Docker runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build image and publish from main
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs verify the Dockerfile without publishing. A main push publishes
          # the date/commit release tag that GitOps then pins.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Export the existing PR build for scanning; main keeps its registry output.
          outputs: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'type=registry' || format('type=docker,dest={0}/notify-bus.tar', runner.temp) }}
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish immutable reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          {
            echo '## Published image'
            echo
            echo 'Use this release tag in the GitOps release pull request:'
            echo
            echo "\`${{ steps.image.outputs.repository }}:${{ steps.release.outputs.tag }}\`"
            echo
            echo "Release tag: \`${{ steps.release.outputs.tag }}\` (date + 8-character commit). CI must never reuse a release tag for another commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Bun for security reporting
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Scan the existing final image
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/notify-bus.tar
          REPORT_DIR: ${{ runner.temp }}/security-reports
          PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          args=(--scanners vuln --list-all-pkgs --format json --exit-code 0 --timeout 10m --output "$REPORT_DIR/image.json")
          if [[ "$PUBLISHED" == true ]]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Build returned no valid digest.' >&2; exit 1; }
            reference="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
            printf '%s\n' "$reference" > "$REPORT_DIR/image-reference.txt"
            printf '\nPublished digest: %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
            trivy image --image-src remote "${args[@]}" "$reference"
          else
            trivy image --input "$IMAGE_ARCHIVE" "${args[@]}"
          fi
          bun scripts/security-report.ts "$REPORT_DIR/image.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final image report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-image-security
          path: ${{ runner.temp }}/security-reports/
          if-no-files-found: error
          retention-days: 30
